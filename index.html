<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>누모 Service</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="tablet.css" />
    <link rel="stylesheet" href="mobile.css" />
    <link rel="stylesheet" href="init.css" />
    <link rel="stylesheet" href="typography.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet" />
  </head>
  <body>
    <header class="header">
      <div class="header-wrapper">
        <div class="header-logo-wrapper">
          <img src="assets/common//logo.png" />
        </div>
        <div class="header-nav-wrapper">
          <nav class="header-nav">
            <a href="#"> 개인정보 처리 방침 </a>
            <a href="#"> 이용 약관 </a>
            <a href="#"> 사업자 정보 확인 </a>
          </nav>
        </div>
      </div>
    </header>
    <section class="hero">
      <div class="hero-container">
        <div class="hero-image-wrapper">
          <img src="assets/hero/main-mockup.png" alt="누모 서비스" class="mockup-img" />
        </div>
        <div class="hero-content-wrapper">
          <div class="hero-content-title">
            <h2 class="headline3">쉽고 빠른 누수 문제 해결</h2>
            <h1 class="headline1">누수의 모든 것, 누수</h1>
            <h1 class="headline1">해결 파트너 누모</h1>
          </div>
          <div class="hero-applink-wrapper">
            <a>
              <img src="assets/common/Mobile app store badge.png" class="app-link-button" />
            </a>
            <a>
              <img src="assets/common/Mobile play store badge.png" class="app-link-button" />
            </a>
          </div>
        </div>
      </div>
    </section>
    <section class="features">
      <div class="features-background-filter"></div>
      <div class="features-container">
        <h4 class="headline5" style="margin-bottom: 12px">누수란</h4>
        <h1 class="headline3">고객과 시공 업체가 편리하게</h1>
        <h1 class="headline3">소통할 수 있는 누수 시공 서비스입니다.</h1>
        <div class="features-icon-wrapper">
          <div class="features-icon">
            <img src="assets/features/chat.png" alt="chat-icon" />
          </div>
        </div>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
